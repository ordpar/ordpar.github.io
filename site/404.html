<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordpar</title>
<meta name="robots" content="noindex">
<!--ORDPAR_HEAD-->
<!-- the head script: sitegen/head.py THEME_JS, one copy (decisions 63), the file
     /site/theme.js since 2026-10-20 -->
<!--ORDPAR_HEADJS-->
<!-- the results show whole articles (site decisions 59): the article page's own sheets,
     then the shell's, which wins where the two meet — one file since 2026-10-20
     (/site/shell-pages.css: article.css, inflection.css, shell.css) -->
<link rel="stylesheet" href="/site/shell-pages.css">
<!--ORDPAR_STRINGS-->
</head>
<body class="ordpar">
<!-- the header: sitegen/chrome.py, one source for every page (decisions 63) -->
<!--ORDPAR_HEADER-->

<main id="ordpar-main" class="ordpar-main ordpar-main--cards" tabindex="-1">
  <p class="ordpar-visually-hidden" data-ordpar-live role="status" aria-live="polite"></p>
  <div data-ordpar-results></div>
</main>

<!-- the footer: sitegen/chrome.py (decisions 63) -->
<!--ORDPAR_FOOTER-->

<script src="/site/inflection.js" defer></script>
<script src="/site/article.js" defer></script>
<script src="/site/mini.js" defer></script>
<!-- personal.js, lookup.js, ahead.js, offline.js, install.js, shell.js and personal-page.js, in
     that order, one file since 2026-10-20 (ahead.js and personal-page.js since decisions 92) -->
<script src="/site/shell-pages.js"></script>
<script>
/* 404.html IS the shell (decisions 24 + 21a, as briefed 2026-09-20). A static host has no
   file at /bm-en/<word>, so the host's 404 handler renders it here:
 *
 *   /bm-en/<word>          -> the search for <word>, in place; the URL stays as typed
 *   /bm-en/<id>/<slug>     -> replaced by /bm-en/<id>/ (the slug is decoration)
 *   anything else          -> a real not-found page (the header's search box is still there)
 *
 * GitHub Pages serves this file with HTTP status 404 for every missing path, so a crawler
 * that follows /bm-en/hus sees 404 with a rendered search page — deliberate: the canonical,
 * indexable URL of a word is its article page /bm-en/<id>/.
 */
(function () {
  'use strict';
  var main = document.getElementById('ordpar-main');
  var results = main.querySelector('[data-ordpar-results]');

  function base() { return window.ORDPAR_BASE || '/'; }

  function segments() {
    var path = decodeURIComponent(location.pathname);
    var b = base();
    if (b !== '/' && path.indexOf(b) === 0) { path = '/' + path.slice(b.length); }
    return path.split('/').filter(function (s) { return s.length > 0; });
  }

  function notFound() {
    var path = location.pathname;
    document.title = ordparShell.t('notfound.title') + ' — ' + ordparShell.t('site.name');
    results.textContent = '';
    var box = document.createElement('section');
    box.className = 'ordpar-notfound';
    var h1 = document.createElement('h1');
    h1.textContent = ordparShell.t('notfound.title');
    var p = document.createElement('p');
    p.textContent = ordparShell.t('notfound.body').split('{path}').join(path);
    var a = document.createElement('a');
    a.href = base();
    a.textContent = ordparShell.t('notfound.home');
    box.appendChild(h1);
    box.appendChild(p);
    box.appendChild(a);
    results.appendChild(box);
  }

  // `record`: the history takes a search the reader made (brief 60b) — the search box used here,
  // a #q= query (or an old ?q=) — but not the automatic search of a mistyped address (/bm-en/<word>)
  function search(word, record) {
    document.title = word + ' — ' + ordparShell.t('site.name');
    // `how.random`: a Random word draw, answered but not recorded nor sent (decisions 115),
    // its entry marked so a reload of it stays a draw (`ordparSearch.takeDrawn`)
    function again(q, how) {
      var drawn = !!(how && how.random);
      history.pushState(drawn ? { q: q, random: true } : { q: q }, '', ordparLookup.searchUrl(q));
      document.title = q + ' — ' + ordparShell.t('site.name');
      ordparSearch.render(main, q, { record: !drawn });
    }
    ordparShell.setSearchHandler(again);
    // once a search here has moved the address to /bm-en/#q=, a similar word's link
    // (/bm-en/#q=<word>) would only move the fragment: answered here (decisions 104)
    ordparSearch.wireFragmentLinks(function (q) { window.scrollTo(0, 0); again(q); });
    ordparSearch.render(main, word, { record: !!record });
  }

  function route() {
    var parts = segments();
    if (parts[0] !== 'bm-en') { notFound(); return; }
    var rest = parts.slice(1);
    if (rest.length === 0) {
      ordparSearch.fragmentAddress();          // an old ?q= address: to #q= (decisions 104)
      var drawn = ordparSearch.takeDrawn();     // a Random word draw is not a search (115)
      search(ordparSearch.queryFromLocation(), !drawn);
      return;
    }
    if (/^\d+$/.test(rest[0])) {
      var target = base() + 'bm-en/' + rest[0] + '/';
      if (target !== location.pathname) { location.replace(target); return; }
      notFound();            // the id itself is missing: never bounce to ourselves
      return;
    }
    if (rest.length === 1) { search(rest[0], false); return; }
    notFound();
  }

  function whenReady() { (window.ordparShell.ready || Promise.resolve()).then(route); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', whenReady);
  } else {
    whenReady();
  }
}());
</script>
</body>
</html>
